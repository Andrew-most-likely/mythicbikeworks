<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.ico" sizes="any">
<title>Mythic Bike Works Board</title>
<style>
@font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-latin.woff2") format("woff2"); font-weight: 400 900; font-stretch: 100% 125%; }
:root {
  --ui: #1e1e1e; --ui-2: #2c2c2c; --ui-line: #383838; --ui-text: #e6e6e6; --ui-muted: #9a9a9a; --sel: #0d99ff;
  --canvas: #e5e5e5; --dot: #c9c9c9;
  --ink: #111311; --paper: #f5f5f2; --red: #c7271c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); font: 400 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ui-text); }
button { font: inherit; color: inherit; }

/* Top bar */
.bar { position: fixed; inset: 0 0 auto 0; height: 44px; background: var(--ui); border-bottom: 1px solid var(--ui-line); display: flex; align-items: center; gap: 12px; padding: 0 12px; z-index: 20; }
.bar .file { font-weight: 600; }
.bar .file span { color: var(--ui-muted); font-weight: 400; }
.bar .spacer { flex: 1; }
.bar a { color: var(--ui-muted); text-decoration: none; font-size: 12px; }
.bar a:hover { color: var(--ui-text); }
.zoom { display: flex; align-items: center; gap: 2px; background: var(--ui-2); border-radius: 6px; padding: 2px; }
.zoom button { background: none; border: 0; padding: 4px 9px; border-radius: 4px; cursor: pointer; min-width: 28px; }
.zoom button:hover { background: var(--ui-line); }
.zoom output { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

/* Layers panel */
.world.far .label { display: none; }
.layers { scrollbar-color: #444 var(--ui); scrollbar-width: thin; position: fixed; top: 44px; bottom: 0; left: 0; width: 240px; background: var(--ui); border-right: 1px solid var(--ui-line); overflow-y: auto; z-index: 15; padding: 8px 0 24px; }
.layers h2 { margin: 10px 14px 6px; font-size: 11px; font-weight: 600; color: var(--ui-muted); text-transform: uppercase; letter-spacing: .06em; }
.layers button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 5px 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layers button:hover { background: var(--ui-2); }
.layers button.active { background: #0d99ff33; color: #fff; }
.layers button.child { padding-left: 30px; color: #cfcfcf; }
.layers .ico { width: 12px; height: 12px; flex: none; opacity: .7; }
.hint { margin: 18px 14px 0; color: var(--ui-muted); font-size: 11.5px; line-height: 1.6; }
.hint kbd { background: var(--ui-2); border: 1px solid var(--ui-line); border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; color: var(--ui-text); }

/* Canvas */
.viewport { position: fixed; top: 44px; left: 240px; right: 0; bottom: 0; overflow: hidden; cursor: default; touch-action: none;
  background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); }
.viewport.panning { cursor: grabbing; }
.viewport.space { cursor: grab; }
.world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

.frame { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 10px rgba(0,0,0,.08); }
.frame img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.frame.selected { outline: calc(2px * var(--inv)) solid var(--sel); }
.label { position: absolute; transform-origin: 0 100%; white-space: nowrap; color: #6b6b6b; font-size: calc(12px * var(--inv)); line-height: 1; display: flex; gap: calc(8px * var(--inv)); align-items: baseline; }
.label b { color: #3d3d3d; font-weight: 600; }
.label a { color: var(--sel); text-decoration: none; pointer-events: auto; }
.frame.selected + .label b, .label.selected b { color: var(--sel); }

.section-title { position: absolute; font: 900 120% "Archivo", sans-serif; font-stretch: 125%; color: #1a1a1a; letter-spacing: -.02em; white-space: nowrap; }
.section-sub { position: absolute; color: #6b6b6b; white-space: nowrap; }

/* Site map board */
.board { position: absolute; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.06); }
.node { position: absolute; background: #fff; border: 2px solid #d9d9d9; border-radius: 10px; overflow: hidden; color: #1a1a1a; }
.node.key { border-color: var(--red); }
.node .thumb { height: 170px; background-size: cover; background-position: top center; border-bottom: 1px solid #e6e6e6; }
.node .meta { padding: 12px 14px; }
.node .meta strong { display: block; font: 700 17px "Archivo", sans-serif; font-stretch: 110%; }
.node .meta span { color: #6b6b6b; font-size: 13px; }
.edge-label { font: 600 14px system-ui, sans-serif; fill: #6b6b6b; }

/* Style guide board */
.sg { position: absolute; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.06); padding: 48px; color: #141614; font-family: "Archivo", sans-serif; }
.sg h3 { margin: 0 0 18px; font: 600 13px system-ui, sans-serif; color: #6b6b6b; text-transform: uppercase; letter-spacing: .08em; }
.sg .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 44px; }
.sw { width: 150px; }
.sw div { height: 90px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
.sw b { display: block; margin-top: 8px; font-size: 15px; }
.sw code { color: #595d57; font: 13px ui-monospace, monospace; }
.type div { margin-bottom: 14px; }
.type small { display: block; color: #6b6b6b; font: 12px system-ui, sans-serif; margin-bottom: 2px; }
.btns { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.b { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 3px; font-weight: 700; font-stretch: 105%; border: 2px solid transparent; }
.b.red { background: #c7271c; color: #fff; }
.b.dark { background: #111311; color: #fff; }
.b.ghost { background: #111311; color: #fff; border-color: rgba(255,255,255,.7); box-shadow: 0 0 0 8px #111311; margin: 0 8px; }
.tl { font-weight: 700; text-decoration: underline; text-decoration-color: #c7271c; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.pricerow { border-top: 2px solid #141614; max-width: 560px; }
.pricerow div { display: flex; justify-content: space-between; padding: 16px 0 6px; font-weight: 700; font-size: 18px; }
.pricerow p { margin: 0 0 16px; color: #595d57; border-bottom: 1px solid #d4d5cf; padding-bottom: 16px; }
.pricerow a { font-weight: 700; color: #141614; }
</style>
</head>
<body>
<div class="bar">
  <span class="file">Mythic Bike Works <span>/ Website board</span></span>
  <span class="spacer"></span>
  <a href="../">Website</a>
  <a href="../hub/">Hub</a>
  <a href="https://github.com/Andrew-most-likely/mythicbikeworks" target="_blank" rel="noopener">GitHub repo</a>
  <div class="zoom" role="group" aria-label="Zoom">
    <button type="button" data-z="out" title="Zoom out (-)">−</button>
    <output data-zoom>100%</output>
    <button type="button" data-z="in" title="Zoom in (+)">+</button>
    <button type="button" data-z="fit" title="Zoom to fit (Shift+1)">Fit</button>
  </div>
</div>

<nav class="layers" aria-label="Layers" data-layers></nav>

<div class="viewport" data-vp>
  <div class="world" data-world></div>
</div>

<script>
(() => {
  const LIVE = "../"; // relative, so links keep working after the move to mythicbikeworks.com
  const D = 1440, T = 768, P = 390, GAP = 160;

  const PAGES = [
    { id: "home", name: "Home", path: "", sizes: { desktop: 7473, tablet: 9074, phone: 10088 } },
    { id: "cane", name: "Cane Creek service center", path: "cane-creek-service-center/", sizes: { desktop: 3685, tablet: 3815, phone: 4481 } },
    { id: "susp", name: "Suspension service", path: "suspension-service/", sizes: { desktop: 3691, tablet: 3779, phone: 4371 } },
    { id: "thanks", name: "Thank-you", path: "thanks.html", sizes: { desktop: 900, tablet: 1024, phone: 844 } },
    { id: "404", name: "404 Not found", path: "404.html", sizes: { desktop: 900, tablet: 1024, phone: 844 } },
  ];
  const STATES = [
    { id: "state-menu", name: "Phone menu open", w: P, h: 844 },
    { id: "state-sent", name: "Message sent", w: P, h: 622 },
  ];
  const DEVICES = [["desktop", "Laptop", D], ["tablet", "Tablet", T], ["phone", "Phone", P]];

  const world = document.querySelector("[data-world]");
  const vp = document.querySelector("[data-vp]");
  const layers = document.querySelector("[data-layers]");
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const place = (n, x, y, w, h) => { Object.assign(n.style, { left: x + "px", top: y + "px" }); if (w != null) n.style.width = w + "px"; if (h != null) n.style.height = h + "px"; world.append(n); return n; };

  const frames = []; // { id, x, y, w, h, node, layerBtn }
  const layerGroup = (title) => layers.append(el("h2", null, title));
  const layerBtn = (label, child, target) => {
    const b = el("button", child ? "child" : "", `<svg class="ico" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="1" fill="none" stroke="currentColor"/></svg>${label}`);
    b.addEventListener("click", () => { select(target); zoomTo(target); });
    layers.append(b); return b;
  };

  function addFrame(id, title, sub, src, x, y, w, h, link) {
    const f = place(el("div", "frame"), x, y, w, h);
    const img = el("img"); img.src = src; img.alt = `${title}, ${sub}`; img.loading = "lazy"; img.decoding = "async"; f.append(img);
    const lab = el("div", "label", `<b>${title}</b><span>${sub}</span>${link ? `<a href="${link}" target="_blank" rel="noopener">Open ↗</a>` : ""}`);
    place(lab, x, y); lab.style.transform = "translateY(calc(-100% - 8px * var(--inv)))";
    const rec = { id, x, y, w, h, node: f, label: lab };
    f.addEventListener("click", (e) => { e.stopPropagation(); select(rec); });
    f.addEventListener("dblclick", (e) => { e.stopPropagation(); zoomTo(rec); });
    frames.push(rec); return rec;
  }

  /* ---- Header ---- */
  const t = place(el("div", "section-title"), 0, 0); t.style.fontSize = "120px"; t.textContent = "Mythic Bike Works";
  const ts = place(el("div", "section-sub"), 4, 160); ts.style.fontSize = "34px"; ts.textContent = "Website board · 5 pages, 3 sizes each, 2 states · Oct 2026";

  /* ---- Site map ---- */
  const SM_Y = 340, SM_W = 3200, SM_H = 1000;
  const smTitle = place(el("div", "section-title"), 0, SM_Y); smTitle.style.fontSize = "64px"; smTitle.textContent = "Site map";
  const board = place(el("div", "board"), 0, SM_Y + 110, SM_W, SM_H);
  const boardRec = { id: "sitemap", x: 0, y: SM_Y + 110, w: SM_W, h: SM_H, node: board };
  frames.push(boardRec);
  const NW = 360, NH = 240;
  const nodes = {
    home: [180, 330, "Home", "/", true],
    cane: [1000, 120, "Cane Creek service center", "/cane-creek-service-center/"],
    susp: [1000, 560, "Suspension service", "/suspension-service/"],
    contact: [1880, 330, "Contact form", "/#contact"],
    thanks: [2700, 120, "Thank-you", "/thanks.html (no-JS fallback)"],
    sent: [2700, 560, "Message sent", "shown in place on the form"],
    nf: [180, 720, "404 Not found", "any broken link"],
  };
  const thumbs = { home: "home-desktop", cane: "cane-desktop", susp: "susp-desktop", contact: "home-desktop", thanks: "thanks-desktop", sent: "state-sent", nf: "404-desktop" };
  for (const [k, [x, y, name, sub, key]] of Object.entries(nodes)) {
    const n = el("div", "node" + (key ? " key" : ""), `<div class="thumb"></div><div class="meta"><strong>${name}</strong><span>${sub}</span></div>`);
    n.querySelector(".thumb").style.backgroundImage = `url(frames/${thumbs[k]}.webp)`;
    if (k === "contact") n.querySelector(".thumb").style.backgroundPosition = "center 86%";
    Object.assign(n.style, { left: x + "px", top: y + "px", width: NW + "px", height: NH + 80 + "px" });
    board.append(n);
  }
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  Object.assign(svg.style, { position: "absolute", left: 0, top: 0, overflow: "visible" });
  svg.setAttribute("width", SM_W); svg.setAttribute("height", SM_H);
  svg.innerHTML = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker></defs>`;
  const mid = (k, side) => { const [x, y] = nodes[k]; const h = NH + 80; return side === "r" ? [x + NW, y + h / 2] : side === "l" ? [x, y + h / 2] : side === "b" ? [x + NW / 2, y + h] : [x + NW / 2, y]; };
  const edge = (a, sa, b, sb, label, dash) => {
    const [x1, y1] = mid(a, sa), [x2, y2] = mid(b, sb), cx = (x1 + x2) / 2;
    const p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", `M${x1} ${y1} C${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
    Object.entries({ fill: "none", stroke: "#8a8a8a", "stroke-width": 3, "marker-end": "url(#ar)" }).forEach(([k, v]) => p.setAttribute(k, v));
    if (dash) p.setAttribute("stroke-dasharray", "10 8");
    svg.append(p);
    if (label) { const tx = document.createElementNS(svgNS, "text"); tx.setAttribute("x", cx); tx.setAttribute("y", (y1 + y2) / 2 - 14); tx.setAttribute("text-anchor", "middle"); tx.setAttribute("class", "edge-label"); tx.textContent = label; svg.append(tx); }
  };
  edge("home", "r", "cane", "l", "Cane Creek bar, menu");
  edge("home", "r", "susp", "l", "Suspension, mail-in links");
  edge("home", "r", "contact", "l", "Request links on every price");
  edge("cane", "r", "contact", "l", "");
  edge("susp", "r", "contact", "l", "");
  edge("contact", "r", "sent", "l", "JavaScript on");
  edge("contact", "r", "thanks", "l", "JavaScript off", true);
  board.append(svg);

  /* ---- Pages ---- */
  layerGroup("Overview"); layerBtn("Site map", false, boardRec);
  const PY = SM_Y + 110 + SM_H + 360;
  const pgTitle = place(el("div", "section-title"), 0, PY); pgTitle.style.fontSize = "64px"; pgTitle.textContent = "Pages";
  const ROW = PY + 220, FY = ROW + 180;
  layerGroup("Pages");
  let bx = 0;
  for (const pg of PAGES) {
    const blockTitle = place(el("div", "section-title"), bx, ROW); blockTitle.style.fontSize = "56px"; blockTitle.textContent = pg.name;
    let x = bx, maxH = 0;
    const kids = [];
    for (const [dev, devName, w] of DEVICES) {
      const h = pg.sizes[dev];
      const rec = addFrame(`${pg.id}-${dev}`, devName, `${w}`, `frames/${pg.id}-${dev}.webp`, x, FY, w, h, LIVE + pg.path);
      kids.push([devName, rec]);
      x += w + GAP; maxH = Math.max(maxH, h);
    }
    const group = { id: pg.id, x: bx, y: FY, w: x - GAP - bx, h: Math.min(maxH, 2200) };
    layerBtn(pg.name, false, group);
    kids.forEach(([n, r]) => { r.layerBtn = layerBtn(n, true, r); });
    bx = x - GAP + 480;
  }

  /* ---- States (after the pages) ---- */
  const stTitle = place(el("div", "section-title"), bx, ROW); stTitle.style.fontSize = "56px"; stTitle.textContent = "States";
  layerGroup("States");
  for (const s of STATES) {
    const rec = addFrame(s.id, s.name, `Phone ${s.w}`, `frames/${s.id}.webp`, bx, FY, s.w, s.h);
    rec.layerBtn = layerBtn(s.name, false, rec);
    bx += s.w + GAP;
  }

  /* ---- Style guide (to the right of the site map) ---- */
  const SG_X = SM_W + 400, SG_Y = SM_Y + 110;
  const sgTitle = place(el("div", "section-title"), SG_X, SM_Y); sgTitle.style.fontSize = "64px"; sgTitle.textContent = "Style guide";
  const sg = place(el("div", "sg"), SG_X, SG_Y, 1500, null);
  sg.innerHTML = `
    <h3>Colors</h3>
    <div class="row">
      ${[["Ink", "#111311"], ["Paper", "#f5f5f2"], ["Tint", "#e9e9e4"], ["Text", "#141614"], ["Muted", "#595d57"], ["Muted on dark", "#9a9e97"], ["Red", "#c7271c"], ["Red on dark", "#ef4a3c"]]
        .map(([n, c]) => `<div class="sw"><div style="background:${c}"></div><b>${n}</b><code>${c}</code></div>`).join("")}
    </div>
    <h3>Type · Archivo</h3>
    <div class="type">
      <div><small>H1 · 900 · width 125%</small><span style="font-weight:900;font-stretch:125%;font-size:84px;letter-spacing:-.035em;line-height:.95">Your bike, dialed in.</span></div>
      <div><small>H2 · 800 · width 120%</small><span style="font-weight:800;font-stretch:120%;font-size:48px;letter-spacing:-.025em">Fork &amp; shock service</span></div>
      <div><small>H3 · 700 · width 105%</small><span style="font-weight:700;font-stretch:105%;font-size:22px">Full overhaul</span></div>
      <div><small>Body · 400</small><span style="font-size:18px;color:#595d57">Modern forks and shocks run on very little oil, and it breaks down fast.</span></div>
      <div><small>Label · 600 · caps</small><span style="font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#595d57">Suspension · Cane Creek Service Center</span></div>
    </div>
    <h3 style="margin-top:40px">Buttons and links</h3>
    <div class="row btns">
      <span class="b red">Request service</span>
      <span class="b dark">Get directions</span>
      <span class="b ghost">Ask about a part</span>
      <span class="tl">Start a build</span>
    </div>
    <h3>Price row</h3>
    <div class="pricerow"><div><span>Tune-up</span><span>$75</span></div><p>Top-to-bottom inspection. Shifting and brakes adjusted, wheels trued.<br><a href="#" onclick="return false" class="tl" style="font-size:15px">Request</a></p></div>`;
  const sgRec = { id: "style", x: SG_X, y: SG_Y, w: 1500, h: 1500, node: sg };
  frames.push(sgRec);
  layerGroup("Design"); layerBtn("Style guide", false, sgRec);

  layers.append(el("p", "hint", `<kbd>Scroll</kbd> pan · <kbd>Ctrl</kbd>+<kbd>Scroll</kbd> or pinch zoom<br><kbd>Space</kbd>+drag or drag empty canvas to pan<br>Double-click a frame to zoom to it<br><kbd>Shift</kbd>+<kbd>1</kbd> fit all · <kbd>+</kbd> / <kbd>-</kbd> zoom · <kbd>0</kbd> 100%`));

  /* ---- Camera ---- */
  let cam = { x: 0, y: 0, s: 0.1 };
  const zoomOut = document.querySelector("[data-zoom]");
  function apply() {
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
    world.style.setProperty("--inv", 1 / cam.s);
    world.classList.toggle("far", cam.s < 0.09);
    const g = 24 * cam.s; const size = g < 8 ? g * 4 : g;
    vp.style.backgroundSize = `${size}px ${size}px`;
    vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
    zoomOut.textContent = Math.round(cam.s * 100) + "%";
  }
  const clamp = (s) => Math.min(4, Math.max(0.02, s));
  function zoomAt(px, py, factor) {
    const s = clamp(cam.s * factor), k = s / cam.s;
    cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.s = s; apply();
  }
  function bounds() {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const n of world.children) { const x = n.offsetLeft, y = n.offsetTop; x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x + n.offsetWidth); y2 = Math.max(y2, y + n.offsetHeight); }
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  function zoomTo(r, pad = 80) {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const s = clamp(Math.min((vw - pad * 2) / r.w, (vh - pad * 2) / r.h, 1));
    cam.s = s; cam.x = (vw - r.w * s) / 2 - r.x * s; cam.y = Math.max(pad, (vh - Math.min(r.h, (vh - pad * 2) / s) * s) / 2) - r.y * s;
    apply();
  }
  const fitAll = () => zoomTo(bounds(), 60);

  let selected = null;
  function select(r) {
    frames.forEach((f) => { f.node.classList.toggle("selected", f === r); f.label && f.label.classList.toggle("selected", f === r); });
    layers.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
    if (r && r.layerBtn) r.layerBtn.classList.add("active");
    selected = r;
  }

  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = vp.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0025));
    else { cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); }
  }, { passive: false });

  // Drag to pan (empty canvas, middle button, or with Space held). Two pointers = pinch zoom.
  let space = false, drag = null; const pts = new Map(); let pinch = null;
  vp.addEventListener("pointerdown", (e) => {
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; drag = null; return; }
    const onFrame = e.target.closest(".frame, .board, .sg");
    if (space || e.button === 1 || !onFrame || e.pointerType === "touch") {
      drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
      vp.setPointerCapture(e.pointerId); vp.classList.add("panning");
    }
  });
  vp.addEventListener("pointermove", (e) => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const rect = vp.getBoundingClientRect();
      zoomAt((a[0] + b[0]) / 2 - rect.left, (a[1] + b[1]) / 2 - rect.top, d / pinch.d); pinch.d = d; return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply();
  });
  const end = (e) => {
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (drag && !drag.moved && !e.target.closest(".frame")) select(null);
    drag = null; vp.classList.remove("panning");
  };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);

  addEventListener("keydown", (e) => {
    if (e.code === "Space" && !space) { space = true; vp.classList.add("space"); e.preventDefault(); }
    const r = vp.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2;
    if (e.key === "!" || (e.shiftKey && e.code === "Digit1")) fitAll();
    else if (e.shiftKey && e.code === "Digit2" && selected) zoomTo(selected);
    else if (e.key === "+" || e.key === "=") zoomAt(cx, cy, 1.25);
    else if (e.key === "-" || e.key === "_") zoomAt(cx, cy, 0.8);
    else if (e.key === "0") { const k = 1 / cam.s; zoomAt(cx, cy, k); }
    else if (e.key === "Escape") select(null);
  });
  addEventListener("keyup", (e) => { if (e.code === "Space") { space = false; vp.classList.remove("space"); } });

  document.querySelectorAll("[data-z]").forEach((b) => b.addEventListener("click", () => {
    const r = vp.getBoundingClientRect();
    if (b.dataset.z === "in") zoomAt(r.width / 2, r.height / 2, 1.25);
    else if (b.dataset.z === "out") zoomAt(r.width / 2, r.height / 2, 0.8);
    else fitAll();
  }));
  addEventListener("resize", () => apply());

  apply();
  requestAnimationFrame(() => location.hash === "#all" ? fitAll() : zoomTo({ x: 0, y: 0, w: SG_X + 1500, h: SM_Y + 110 + SM_H }, 60));
})();
</script>
</body>
</html>
